services:
  - type: web
    name: ittat-auth-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://abduaziz475.github.io
      - key: ESKIZ_FROM
        value: "4546"
      - key: JWT_SECRET
        generateValue: true
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
      - key: DIRECTOR_CODE
        sync: false
